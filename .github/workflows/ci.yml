# CI — build + test + package smoke on all three OSes.
# This matrix IS the cross-platform packaging proof: every push must build the
# publishable dist, pass the full e2e suite, and install+run the packed tarball
# the way a stranger's `npx callosium` would — on Linux, Windows, and macOS.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # onnxruntime-node's postinstall reaches out to nuget.org for the OPTIONAL GPU
      # (CUDA/TensorRT) provider blobs. They are multi-GB, we never use them (CPU
      # inference only), and the download is the single most common CI failure —
      # it timed out on ubuntu and failed the run while Windows/macOS passed.
      # ONNXRUNTIME_NODE_INSTALL=skip keeps the CPU binaries that ship inside the
      # package and skips only the unbundled extras, so CI stops depending on a
      # third-party CDN. scripts/build-portable.mjs already strips these same blobs.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run typecheck
      - run: npm run build
      # e2e suites run from source (node 24 type-stripping); they cover the MCP
      # server (scoping, attribution, rotation), auth, entitlement, read_note.
      - run: npm test
      # package smoke — install the packed tarball into a clean dir and run the
      # real user flow: init a brain, write a note, recall it with evidence.
      # --ignore-scripts keeps this gate fast and hermetic; the consumer-install
      # job below is the one that runs the install a stranger actually gets.
      - name: pack smoke
        shell: bash
        run: |
          set -e
          npm pack
          mkdir /tmp/packtest && cd /tmp/packtest
          npm init -y > /dev/null
          npm install --ignore-scripts "$(ls "$GITHUB_WORKSPACE"/callosium-*.tgz)"
          npx callosium init brain
          printf 'the zephyr project deadline is 22 August, budget 40000 QAR\n' > "brain/Inbox/zephyr project.md"
          npx callosium recall "zephyr deadline" --brain brain | grep -q "zephyr project.md"
          echo "pack smoke OK"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: tarball
          path: callosium-*.tgz
          retention-days: 5

  # The install a stranger actually gets: no --ignore-scripts, no skip env, no
  # cache. Everything above this line installs Callosium in a way no user ever
  # will, so until this job existed nothing proved `npm i callosium` works at
  # all — the postinstall of a transitive dep could fail on every machine on
  # earth and CI would still be green.
  #
  # It is also the only place the true install cost is visible. onnxruntime-node
  # declares a cuda12 requirement on linux/x64 (and ONLY there — win32, darwin
  # and linux/arm64 pull nothing), so a default install on a Linux box fetches
  # GPU provider blobs from nuget.org that Callosium never loads: inference here
  # is CPU-only. The step prints the elapsed time and the installed size so a
  # regression in either shows up in the log instead of in a user's bandwidth.
  consumer-install:
    needs: build-test-pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - name: install as a user would
        shell: bash
        run: |
          set -e
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          start=$(date +%s)
          # onnxruntime-node's postinstall fetches GPU provider blobs from nuget.org on
          # linux/x64; nuget has transient outages (an ETIMEDOUT there once reddened this
          # job on an unrelated commit). Retry a few times so a network blip doesn't fail
          # the build -- a genuinely broken postinstall still fails all attempts.
          n=0; until npm install "$(ls ../callosium-*.tgz)"; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "install failed after $n attempts"; exit 1; }
            echo "install attempt $n failed (likely a transient nuget.org outage) -- retrying in 15s"; sleep 15
          done
          echo "install took $(( $(date +%s) - start ))s"
          du -sh node_modules 2>/dev/null || true
      - name: run as a user would
        shell: bash
        working-directory: consumer
        run: |
          set -e
          npx callosium init brain
          printf 'the zephyr project deadline is 22 August, budget 40000 QAR\n' > "brain/Inbox/zephyr project.md"
          npx callosium recall "zephyr deadline" --brain brain | grep -q "zephyr project.md"
          echo "consumer install OK"
