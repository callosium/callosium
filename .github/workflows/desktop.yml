# Stage-2: build the Callosium desktop app (Tauri) on GitHub's Windows runner —
# which has NO Smart App Control, so cargo's build-script executables run freely
# (the dev machine's SAC blocks them). Produces the NSIS installer as an artifact.
#
# CODE SIGNING (required for the app to RUN on default-secure Windows 11 / SAC):
# add an EV or OV code-signing cert as repo secrets and uncomment the env below.
# Until then the artifact is UNSIGNED and only runs where SAC is off.
name: desktop
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

# tauri-action creates the GitHub Release and uploads the signed installer +
# latest.json, so the workflow token needs write access to repo contents.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Guard — the updater pubkey must be real before a signed release
        shell: bash
        run: |
          if grep -q "REPLACE_WITH_callosium.key.pub_CONTENTS" desktop/src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey is still the placeholder. Generate the signing keypair, add TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) as repo secrets, and paste callosium.key.pub into tauri.conf.json before cutting a desktop release."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Rust toolchain (stable-msvc)
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install deps (engine + desktop CLI)
        run: |
          npm ci
          npm ci --prefix desktop
      - name: Stage the Node payload (app dist + runtime), no tauri build
        working-directory: desktop
        run: node build-desktop.mjs --stage-only
      # Auto-updater signing. The updater's minisign key is SEPARATE from Windows
      # code-signing (Authenticode/SAC, still a later step). Add these repo secrets
      # first: TAURI_SIGNING_PRIVATE_KEY (contents of callosium.key) and
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD. tauri-action then produces the signed
      # NSIS + .sig and generates + uploads latest.json to the GitHub Release.
      - name: Build, sign & publish the desktop updater release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: 'Callosium Desktop v__VERSION__'
          releaseBody: 'Download the installer below. Existing installs update themselves.'
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
