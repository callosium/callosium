[package]
name = "callosium-desktop"
version = "0.1.0"
description = "Callosium — one brain, every AI, your files."
authors = ["Callosium"]
edition = "2021"
rust-version = "1.77.2"

# The desktop shell is a thin native wrapper: it runs the SAME Node dashboard
# server the CLI does (bundled under resources/payload), keeps it alive in the
# background, shows it in a window + a tray icon, and never lets the brain go
# down while the app is running. All product logic stays in the Node engine.

[lib]
name = "callosium_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For the per-launch handshake token. Already in the tree via tauri; made direct so the token comes
# from the OS CSPRNG instead of clock+pid, which are both readable by any other local process.
getrandom = "0.2"

# Job Objects, so the OS kills the server process whenever the shell dies — see bind_child_lifetime.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading", # JOBOBJECT_EXTENDED_LIMIT_INFORMATION lives behind this one
    "Win32_Security",         # CreateJobObjectW's lpJobAttributes
    "Win32_Foundation",
] }

[profile.release]
# The shell just spawns the Node server + manages tray/window — its size and
# micro-perf are irrelevant next to the ~100MB bundled Node payload, so we skip
# LTO/codegen-units tuning to keep builds fast. strip keeps the binary tidy.
panic = "abort"
strip = true
