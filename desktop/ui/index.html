<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Callosium</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: #0a0a0f; color: #e9e6f2;
        font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Menlo, monospace;
        -webkit-user-select: none; user-select: none;
      }
      .mark { width: 74px; height: 74px; border-radius: 16px;
        background: radial-gradient(120% 120% at 30% 20%, #ff2e88 0%, #7c3aed 55%, #06b6d4 120%);
        display: grid; place-items: center; box-shadow: 0 0 44px -10px #ff2e88; }
      .mark span { font-weight: 800; font-size: 40px; color: #0a0a0f; font-family: "Press Start 2P", ui-monospace, monospace; }
      h1 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; margin: 0; color: #b9b3cf; font-weight: 600; }
      .sub { font-size: 12px; color: #6f6a86; min-height: 16px; }
      .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
      .hint { font-size: 11px; color: #4b475e; max-width: 380px; text-align: center; line-height: 1.6; opacity: 0; transition: opacity .5s; }
      .hint.show { opacity: 1; }
      a { color: #ff2e88; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="mark"><span>C</span></div>
    <h1>Callosium</h1>
    <div class="sub"><span class="dots">waking your brain</span></div>
    <div class="hint" id="hint">
      First launch downloads a small language model (~120&nbsp;MB, once) for meaning-based
      search — keyword search works immediately either way. If this screen stays a while,
      it's just that. <br /><a id="manual" hidden></a>
    </div>
    <script>
      // This page does NOT navigate itself, deliberately. It used to: it polled a
      // hard-coded http://127.0.0.1:4319 and redirected as soon as anything answered.
      // The shell does not run the server on 4319 — it asks the OS for a free port and
      // then verifies, over a per-launch token, that the thing listening there is the
      // server IT started. Polling a guessed port threw all of that away: whatever else
      // held 4319 (a `callosium serve` in a terminal on a different brain, or any other
      // local process — loopback is not user-isolated on Windows) got loaded into this
      // trusted native window, unverified. The window hosts the sign-in flow, so that is
      // a credential-phishing surface, not just a wrong-vault bug. It also silently
      // overwrote the shell's own "couldn't start" error screen, since the interval kept
      // firing after the error was shown.
      //
      // The shell owns navigation now (see wait_for_server / w.navigate in lib.rs). All
      // this page does is offer the real URL as text once the shell tells us what it is —
      // never as an automatic redirect, and never a port we guessed.
      // The shell may eval its __CAL_URL before OR after this script runs, so handle both orders:
      // check once now, and expose a setter it can call if it got here first.
      function showManual(u) {
        if (typeof u !== "string" || !/^http:\/\/127\.0\.0\.1:\d+$/.test(u)) return;
        var a = document.getElementById("manual");
        a.href = u;
        a.textContent = "open manually";
        a.hidden = false;
      }
      window.__calSetUrl = showManual;
      showManual(window.__CAL_URL);
      setTimeout(function () { document.getElementById("hint").classList.add("show"); }, 6000);
    </script>
  </body>
</html>
