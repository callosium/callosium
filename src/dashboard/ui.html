// ===================== onboard =====================
// ── Onboarding journey ───────────────────────────────────────────────────────
// First-run flow that covers the shell: brain-art welcome → sign-up (dummy
// social) → brain setup (ingest an existing brain, or create one the AI fills
// via MCP). Renders into #onboard. Bilingual via the global t(en,ar). Calls the
// global enterApp() once the user is signed in AND a brain is connected.
// All state namespaced state.ob_*.

// ── the signature rotating ASCII brain (ported from the design system's
// ascii-brain.html; source image served locally at /assets/brain.png) ──
const OB_RAMP = ' .`:;~=+*x#%@';
const OB_SECTORS = [
  { x:0.92, y:0.22, r:0.55, col:'#FF2E88', w:0.55, ph:0.0 },
  { x:0.02, y:0.66, r:0.52, col:'#52F2B8', w:0.42, ph:1.7 },
  { x:-0.98, y:0.18, r:0.50, col:'#B44BFF', w:0.66, ph:3.1 },
  { x:0.18, y:-0.38, r:0.52, col:'#FF6B3D', w:0.49, ph:4.4 },
  { x:-0.88, y:-0.56, r:0.42, col:'#FFB454', w:0.60, ph:5.5 },
];
// light-theme palette for the same sectors (deepened so the brain reads on paper)
const OB_LIGHT_COLORS = { base1:'#5E5773', base2:'#141019', cal:'#E01670', sectors:['#E01670','#0E7A50','#7A2BD0','#C8401C','#8F6100'] };
function ob_hash(n){ n=(n^61)^(n>>>16); n=n+(n<<3); n=n^(n>>>4); n=Math.imul(n,0x27d4eb2d); return((n^(n>>>15))>>>0)/4294967296; }
function ob_stopBrain(){
  if(state.ob_brainIv){ clearInterval(state.ob_brainIv); state.ob_brainIv=null; }
  if(state.ob_flareIv){ clearInterval(state.ob_flareIv); state.ob_flareIv=null; }
}
function ob_startBrain(){
  ob_stopBrain();
  const cv = document.getElementById('obBrain'); if(!cv) return;
  const bg = cv.getContext('2d');
  const COLS=130, ROWS=42, CW=cv.width/COLS, CH=cv.height/ROWS;
  const AX=1.38, AY=0.98, PITCH=0.30, PCA=Math.cos(PITCH), PSA=Math.sin(PITCH), FOV=3.1;
  let pts = state.ob_pts || null, theta=0, bT=0;
  const flare = new Float32Array(OB_SECTORS.length);
  const zbuf=new Float32Array(COLS*ROWS), bbuf=new Float32Array(COLS*ROWS);
  const cbuf=new Uint8Array(COLS*ROWS), pbuf=new Float32Array(COLS*ROWS), sbuf=new Float32Array(COLS*ROWS);
  if(!pts){
    const img=new Image();
    img.onload=()=>{
      const FW=168,FH=104,sx=270,sy=10,sw=830,sh=750;
      const off=document.createElement('canvas'); off.width=FW; off.height=FH;
      const og=off.getContext('2d'); og.fillStyle='#000'; og.fillRect(0,0,FW,FH);
      const fscale=Math.min(FW/sw,FH/sh), fdw=Math.round(sw*fscale), fdh=Math.round(sh*fscale);
      const fdx=(FW-fdw)>>1, fdy=(FH-fdh)>>1;
      og.imageSmoothingEnabled=true; og.drawImage(img,sx,sy,sw,sh,fdx,fdy,fdw,fdh);
      const data=og.getImageData(0,0,FW,FH).data, L=new Float32Array(FW*FH);
      for(let i=0;i<FW*FH;i++) L[i]=(data[i*4]*0.299+data[i*4+1]*0.587+data[i*4+2]*0.114)/255;
      const dist=new Int16Array(FW*FH).fill(-1), q=[];
      for(let y=0;y<FH;y++)for(let x=0;x<FW;x++){ const i=y*FW+x; if(L[i]<0.07){ dist[i]=0; q.push(i); } }
      for(let h=0;h<q.length;h++){ const i=q[h],x=i%FW,y=(i/FW)|0;
        for(const[ox,oy]of[[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+ox,ny=y+oy; if(nx<0||nx>=FW||ny<0||ny>=FH)continue; const ni=ny*FW+nx; if(dist[ni]===-1){ dist[ni]=dist[i]+1; q.push(ni); } } }
      let maxD=1; for(let i=0;i<FW*FH;i++) if(dist[i]>maxD) maxD=dist[i];
      const P=[], N=3400; let tries=0;
      while(P.length<N && tries<N*40){ tries++;
        const x=(Math.random()*FW)|0,y=(Math.random()*FH)|0,i=y*FW+x,lum=L[i];
        if(lum<0.09||Math.random()>Math.pow(lum,1.1))continue;
        const u=(x-fdx)/fdw,v=(y-fdy)/fdh, px=(u-0.5)*2*AX, py=(0.5-v)*2*AY;
        const halfDepth=Math.sqrt(Math.max(0,dist[i])/maxD)*0.78;
        const cal=lum>0.5&&(((u-0.40)/0.27)**2+((v-0.39)/0.15)**2)<1;
        const z=cal?(Math.random()*2-1)*Math.min(0.15,halfDepth):(Math.random()*2-1)*halfDepth;
        let sec=-1,sw2=0;
        for(let s2=0;s2<OB_SECTORS.length;s2++){ const S=OB_SECTORS[s2]; const d2=((px-S.x)/S.r)**2+((py-S.y)/S.r)**2; const wgt=Math.exp(-d2*1.6); if(wgt>sw2){ sw2=wgt; sec=s2; } }
        P.push({px,py,z,lum,cal,sec,sw:sw2,phase:ob_hash(P.length)*6.28});
      }
      pts=P; state.ob_pts=P;
      // /assets/brain.png lands AFTER the single synchronous draw() below. With the
      // rotation interval running that self-corrects within 85ms — but under
      // reduce-motion there IS no interval, so the hero sat on the "waking the
      // cortex…" placeholder forever and the signature brain never appeared at all.
      // Paint the settled frame the moment the points exist.
      draw();
    };
    img.onerror=()=>{ /* offline / missing asset — the caption still welcomes */ };
    img.src='/assets/brain.png';
  }
  state.ob_flareIv = setInterval(()=>{ flare[(Math.random()*OB_SECTORS.length)|0]=1; }, 1700);
  const draw=()=>{
    bT+=0.06; bg.clearRect(0,0,cv.width,cv.height);
    if(!pts){ bg.font='12px monospace'; bg.fillStyle='#544E64'; bg.textAlign='center'; bg.fillText(t('waking the cortex…','يستيقظ الدماغ…'), cv.width/2, cv.height/2); bg.textAlign='left'; return; }
    theta+=0.016;
    const act=OB_SECTORS.map((S,i)=>{ flare[i]*=0.955; return Math.max(0,Math.min(1,0.30+0.30*Math.sin(bT*S.w+S.ph)+flare[i])); });
    zbuf.fill(-1e9); cbuf.fill(0); sbuf.fill(0);
    const ca=Math.cos(theta),sa=Math.sin(theta), SC=(COLS/2-2)/(AX+0.45), SR=(ROWS/2-1)/(AY+0.25);
    for(const p of pts){
      const xs=p.px*ca+p.z*sa, zs0=-p.px*sa+p.z*ca, ys=p.py*PCA-zs0*PSA, zs=p.py*PSA+zs0*PCA, persp=FOV/(FOV-zs);
      const c=(COLS/2+xs*SC*persp)|0, r=(ROWS/2-ys*SR*persp)|0;
      if(c<0||c>=COLS||r<0||r>=ROWS)continue;
      const i=r*COLS+c; if(zs<=zbuf[i])continue; zbuf[i]=zs;

// ── folder picker (shared by existing + create) ──

// ── VIEW: ingest progress ──
function ob_ingestHTML(){
  const ph = state.ob_ingest || { step:'scan', label:t('reading your notes','نقرأ ملاحظاتك'), pct:0, stats:{} };
  const phases=[['scan',t('reading your notes','نقرأ ملاحظاتك')],['graph',t('connecting the dots','نربط النقاط')],['embed',t('learning what they mean','نتعلّم معناها')]];
  const idx = phases.findIndex(p=>p[0]===ph.step);
  const rows = phases.map((p,i)=>{ const st=i<idx?'done':i===idx?'run':'idle'; return '<div style="display:flex;align-items:center;gap:12px;padding:8px 2px;font-family:var(--mono);font-size:13.5px;color:'+(st==='done'?'var(--dust)':st==='run'?'var(--starlight)':'var(--faint)')+'"><span style="width:16px;text-align:center;color:'+(st==='done'?'var(--acid)':st==='run'?'var(--synapse)':'var(--faint)')+'">'+(st==='done'?'✓':st==='run'?'▸':'·')+'</span>'+p[1]+'</div>'; }).join('');
  return '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px">'
    + '<div style="width:480px;max-width:100%">'
    + '<h1 style="font-family:var(--pixel);font-weight:700;font-size:28px;text-align:center;margin-bottom:20px">'+t('building your brain','نبني دماغك')+'</h1>'
    + '<div style="border:1px solid var(--edge2);border-radius:0;background:var(--surface);padding:22px 24px">'
    + rows
    + '<div style="height:6px;background:var(--surface2);border-radius:0;overflow:hidden;margin:16px 0 8px;position:relative"><i style="display:block;height:100%;width:'+Math.round(ph.pct||0)+'%;background:var(--synapse);transition:width .2s"></i><i style="position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:barflow 1.3s linear infinite"></i></div>'
    + (ph.label ? '<div style="font-family:var(--mono);font-size:11.5px;color:var(--dust);margin-top:8px">'+esc(ph.label)+'</div>' : '')
    + '<div style="font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:10px">'+t('runs entirely offline on this device.','يعمل بالكامل دون إنترنت على هذا الجهاز.')+'</div>'
    + '</div>'
    // escape hatch — never trap the user on this screen if the stream stalls
    + '<div style="text-align:center;margin-top:18px"><button type="button" data-ob="cancelIngest" style="font-family:var(--mono);font-size:11.5px;color:var(--faint);cursor:pointer;border-bottom:1px dashed var(--edge);padding-bottom:1px;background:none;border-top:0;border-left:0;border-right:0">'+t('cancel','إلغاء')+'</button></div>'
    + '</div></div>';
}

// ── the copy-paste kickoff prompt handed to ANY AI: it connects over MCP, then
// (raw) files the unstructured notes you drop in, (blank) interviews you and
// writes your first memories, or (existing) tidies what's there and verifies
// recall. This is the "setup tool" payload — one per onboarding door. ──
function ob_kickoffPrompt(mode){
  const tools = 'get_map, get_filing_rules, recall, list_notes, read_note, write_note, append_note, overview, glossary, brain_check';
  if(mode==='blank'){
    return "You are now connected to my brand-new, EMPTY Callosium second brain through its MCP tools ("+tools+"). Give it its first memories by interviewing me:\n\n"
      + "1. First call get_filing_rules so you know this brain's note types, folders, and naming rules — file everything by those rules, don't invent your own structure.\n"
      + "2. Ask me a few questions at a time — never a wall of questions. Cover, in this order: who I am and what I do; the projects or ventures I'm working on right now and where each one stands; the key people around me; the tools and systems I use daily; my current goals and what's blocking them.\n"
      + "3. After each round of answers, save what you learned with write_note before asking more: a profile note about me, one per project, one per person, one per key tool — clear titles, the right note type, and [[wiki-links]] between them so the graph forms from day one. write_note auto-files a type that has a home (person→People/, knowledge→Knowledge/, initiative, memory…); for a note with no automatic home — your profile of me, or a client/project — pass an explicit `path` so it lands in the right folder instead of the Inbox.\n"
      + "4. When the basics are covered, run brain_check and fix anything it flags, then run 2–3 recall queries on things I just told you and show me the brain remembers them.\n"
      + "5. Finish by calling get_map and showing me the map of what my brain now contains and what I should add next.";
  }
  if(mode==='raw' || mode==='new'){
    return "You are now connected to my new Callosium second brain through its MCP tools ("+tools+"). I'm handing you my raw, unstructured material and I want YOU to structure it into the brain — you understand content far better than any rule engine, so you do the reading and distilling; the brain gives you the rules and files each note where you tell it.\n\n"
      + "1. First call get_map to see how this brain is organized, then get_filing_rules to learn exactly where each kind of note goes plus the SENSITIVE-topics rule, naming, frontmatter, and ground-truth rules. Follow them; do not invent your own structure.\n"
      + "2. I'll point you at my raw files (documents, chat exports, notes) — they'll be in the Inbox/ folder. Read them with list_notes + read_note.\n"
      + "3. Turn each into a DISTILLED note with write_note: clear title, the right note type, [[wiki-links]] to related notes. write_note auto-files a note to its home when the type has one (person→People/, knowledge→Knowledge/, plus initiative, memory, log, milestone, reference); when a note has NO automatic home — a client/project workspace, or a Home/MOC hub — pass an explicit `path` (write_note takes one) into the folder the filing rules named, or it falls to the Inbox. Obey the SENSITIVE rule strictly — anything touching health, medical, intimate, or identity matters (mine OR a family member's) goes in Private/, and a mixed source goes WHOLLY to Private/. For any authoritative/verbatim source (a PDF, spec, contract, export), follow the ground-truth protocol. Never dump a raw transcript as a note.\n"
      + "4. CREATE THE ENTITY NOTES: for EVERY person, client, project, or tool you referenced with [[Name]], create its own short note so NO [[link]] is left dangling — a person as type person (→ People/), a tool/topic as type knowledge (→ Knowledge/), and a client or project at an explicit `path` under its Work/Projects home (project has no auto-route, so name the path yourself). Call glossary/resolve first so you don't duplicate one.\n"
      + "5. WIRE THE HUBS: create a Home note and a short MOC (map-of-content) for each major topic (each client, each life area), each written at an explicit `path` (a hub has no auto-route), and link every note into a hub so NOTHING is an orphan — every note must be reachable from a hub.\n"
      + "6. Verify: run brain_check and fix until there are ZERO broken links (create any missing entity note) and no orphans (link them to a hub); list only what genuinely needs my decision. Finish by calling get_map and summarising how you organized everything and where it landed.";
  }
  return "You are now connected to my Callosium second brain through its MCP tools ("+tools+"). Help me tidy it and confirm it works:\n\n"

    + "3. Whenever you add or edit a note, use write_note / append_note so it is filed in the right folder and attributed to you.\n"
    + "4. Verify: run 2–3 recall queries on topics you saw and confirm they return the right notes. Then summarise what you found, what you fixed, and what needs me.";
}

// ── dispatch + paint ──
function renderOnboard(phase){
  state.onboardPhase = phase;
  // Complete an OAuth redirect on first onboarding render — if the user is
  // returning from Google/GitHub, this picks up the session and proceeds.
  if(!state.ob_sbChecked) ob_checkSupabaseSession();
  if(!state.ob_view) state.ob_view = (phase==='setup') ? 'choice' : 'hero';
  const el = $('#onboard'); if(!el) return;
  el.style.display='block';
  el.setAttribute('dir', state.lang==='ar'?'rtl':'ltr');
  const v = state.ob_view;
  let view = '';
  if(v==='hero') view = ob_heroHTML();
  else if(v==='signup') view = ob_signupHTML();
  else if(v==='choice') view = ob_choiceHTML();
  else if(v==='existing') view = ob_pickerHTML('point to your notes','وجّه إلى ملاحظاتك','use this folder','استخدم هذا المجلد','existing');
  else if(v==='create') view = ob_pickerHTML('where should your brain live?','أين يعيش دماغك؟','create here','أنشئ هنا','create');
  else if(v==='ingest') view = ob_ingestHTML();
  else if(v==='connect' || v==='createdone') view = ob_connectHTML();
  // grid + glow backdrop behind a positioned content layer, so every view sits
  // on the "square background" instead of a bland black void.
  el.innerHTML = ob_backdrop() + '<div style="position:relative;z-index:1">'+view+'</div>';
  ob_wire();
  // On the connect step, mint the AI's private MCP connection automatically so the
  // config box fills in without an extra click.
  if((v==='connect' || v==='createdone') && !state.ob_pairConfig && !state.ob_pairing && !state.ob_preview) ob_doPair();
  // signature motions: the rotating ASCII brain + the memory-filing neuron run
  // ONLY on the hero; both are torn down on every other view (no leaked loops).
  if(v==='hero'){ ob_startBrain(); ob_startNeuron(); } else { ob_stopBrain(); ob_stopNeuron(); }
}
function ob_nav(v){ state.ob_err=null; state.ob_view=v; renderOnboard(state.onboardPhase); }

async function ob_browse(dir){
  try{ const r = await post('/api/browse', dir!=null?{path:dir}:{}); if(r.error){ state.ob_err=r.error; renderOnboard(state.onboardPhase); return; } state.ob_browse=r; state.ob_selected=r.dir; state.ob_err=null; }
  // short-circuit on failure — don't fall through and inspect a stale/undefined
  // path, which would mix an unrelated inspect result with the browse error.
  catch(e){ state.ob_err='couldn’t open that folder'; renderOnboard(state.onboardPhase); return; }
  // inspect the current dir for an existing brain / note count
  try{ const ins = await post('/api/inspect', { path: state.ob_selected }); state.ob_inspect = ins.error? null : ins; }catch(e){ state.ob_inspect=null; }
  renderOnboard(state.onboardPhase);
}
async function ob_selectDir(path){
  state.ob_selected = path;
  // surface a browse failure here too (mirrors ob_browse) — otherwise the folder
  // highlights as selected but the listing never updates, with no explanation.
  try{ const r = await post('/api/browse', { path }); if(!r.error){ state.ob_browse=r; state.ob_err=null; } else { state.ob_err=r.error; } }
  catch(e){ state.ob_err='couldn’t open that folder'; }
  try{ const ins = await post('/api/inspect', { path }); state.ob_inspect = ins.error? null : ins; }catch(e){ state.ob_inspect=null; }
  renderOnboard(state.onboardPhase);
}
// Open the real OS folder chooser (the local server pops it on the user's desktop)
// and adopt whatever they pick — routed through ob_selectDir so it inspects + enables
// "use" exactly like the paste box. Cancel = no change. This is the singular, native
// "select your folder" flow that replaces the confusing in-page browser + paste trap.
async function ob_pickNative(){
  if(state.ob_picking) return; state.ob_picking = true; // one dialog at a time (a fast double-click else pops two)
  state.ob_err = null;
  try{
    let r; try{ r = await post('/api/pick-folder', {}); }catch(e){ state.ob_err = t('couldn’t open the folder picker','تعذّر فتح منتقي المجلدات'); renderOnboard(state.onboardPhase); return; }
    if(r && r.httpStatus){ state.ob_err = t('couldn’t open the folder picker','تعذّر فتح منتقي المجلدات'); renderOnboard(state.onboardPhase); return; }
    if(r && r.error){ state.ob_err = r.error; renderOnboard(state.onboardPhase); return; }
    if(!r || r.cancelled || !r.path) return; // user closed the dialog — leave everything as-is
    await ob_selectDir(r.path);
  } finally { state.ob_picking = false; }
}
// Close the live stream + clear the stall watchdog. Safe to call repeatedly.
function ob_ingestCleanup(){
  try{ if(state.ob_ingestES){ state.ob_ingestES.close(); state.ob_ingestES=null; } }catch(_){}
  if(state.ob_ingestWatchdog){ clearTimeout(state.ob_ingestWatchdog); state.ob_ingestWatchdog=null; }
  if(state.ob_enterTimer){ clearTimeout(state.ob_enterTimer); state.ob_enterTimer=null; } // cancel the pending enterApp()
}
// User-initiated cancel from the progress screen — back to the folder picker.
function ob_ingestCancel(){ ob_ingestCleanup(); state.ob_view='existing'; state.ob_err=null; renderOnboard(state.onboardPhase); }
function ob_ingestStream(){
  ob_ingestCleanup();  // never leave a prior stream/watchdog running
  state.ob_view='ingest'; state.ob_ingest={ step:'scan', label:'', pct:0 }; renderOnboard(state.onboardPhase);
  const es = new EventSource(CCT_Q('/api/ingest?path='+encodeURIComponent(state.ob_selected)));
  state.ob_ingestES = es;
  let notes=0;
  // Watchdog: if the server goes silent (hangs mid-ingest and never closes the
  // connection), the EventSource emits no 'error' either — so the screen would
  // hang forever. Every event resets it; 60s of total silence trips the same
  // failure path as an error, freeing the user from the dead-end.
  const bump = ()=>{ if(state.ob_ingestWatchdog) clearTimeout(state.ob_ingestWatchdog);
    state.ob_ingestWatchdog = setTimeout(()=>{ ob_ingestCleanup(); state.ob_err='ingest stalled — try again.'; state.ob_view='existing'; renderOnboard(state.onboardPhase); }, 180000); };
  bump();
  es.addEventListener('phase', e=>{ bump(); try{ const d=JSON.parse(e.data); state.ob_ingest.step=d.step; state.ob_ingest.label=''; state.ob_ingest.pct = d.step==='scan'?15:d.step==='graph'?45:70; renderOnboard(state.onboardPhase); }catch(_){} });
  es.addEventListener('stat', e=>{ bump(); try{ const d=JSON.parse(e.data); if(d.notes) notes=d.notes; }catch(_){} });
  es.addEventListener('embed', e=>{ bump(); try{ const d=JSON.parse(e.data); if(d.total){ state.ob_ingest.pct = 70 + Math.round((d.done/d.total)*28); state.ob_ingest.label = t('processing your notes','نعالج ملاحظاتك')+' · '+d.done+' / '+d.total; renderOnboard(state.onboardPhase); } }catch(_){} });
  // first run only: the ~120MB language model downloads once — show it as a
  // download, not a mysterious hang at 70%.
  es.addEventListener('model', e=>{ bump(); try{ const d=JSON.parse(e.data); state.ob_ingest.label = d.label || ''; renderOnboard(state.onboardPhase); }catch(_){} });
  // Refresh the overview BEFORE the connect guide paints. state.mcp — whether the local MCP
  // endpoint actually bound — only ever arrives from /api/overview, and on this path boot()'s one
  // call happened while there was still no brain, so it is null. The guide's "this URL will not
  // answer" warning is gated on it, so without this the very user it was written for (first run,
  // a zombie Callosium still holding the port) copies a URL for a dead port with no warning. The
  // create-a-brain path already refreshes here — see ob_doInit.
  es.addEventListener('done', ()=>{ ob_ingestCleanup(); state.ob_ingest.pct=100; renderOnboard(state.onboardPhase); state.ob_setupMode='existing';
    state.ob_enterTimer = setTimeout(async ()=>{ state.ob_enterTimer=null;
      const view = state.ob_view;
      try{ await loadOverview(); }catch(_){}
      if(state.ob_view !== view) return;       // user cancelled / navigated while it was loading
      ob_nav('connect');
    }, 700); });
  es.addEventListener('error', ()=>{ ob_ingestCleanup(); state.ob_err='ingest didn’t finish — try again.'; state.ob_view='existing'; renderOnboard(state.onboardPhase); });
}
// Guest = fully local, no hosted account (just a local record so the shell has a name).
async function ob_doSignup(provider){
  const name = (document.getElementById('obName') && document.getElementById('obName').value.trim()) || '';
  try{
    const r = await post('/api/signup', { provider, name });
    if(r.error){ state.ob_err=r.error; renderOnboard(state.onboardPhase); return; }
    state.account = r.account; state.ob_err=null;
    if(hasBrain()) enterApp(); else ob_nav('choice');
  }catch(e){ state.ob_err='couldn’t continue — the engine didn’t answer.'; renderOnboard(state.onboardPhase); }
}
// OAuth sign-in via Supabase. Redirects away, returns to this origin, and the
// session is completed on the next onboarding render (ob_checkSupabaseSession).
async function ob_oauth(provider){
  const sb = await sbEnsure(); // loads the Supabase UMD on this first auth use
  if(!sb){ state.ob_err='sign-in is offline right now — check your connection, or continue as guest.'; renderOnboard(state.onboardPhase); return; }
  state.ob_err=null; state.ob_authMsg=null;
  try{
    const { error } = await sb.auth.signInWithOAuth({ provider, options:{ redirectTo: window.location.origin } });
    if(error){ state.ob_err = /not enabled/i.test(error.message) ? (provider+' sign-in isn’t enabled on the server yet — use email, or continue as guest.') : error.message; renderOnboard(state.onboardPhase); }
  }catch(e){ state.ob_err='couldn’t start sign-in — try again, or continue as guest.'; renderOnboard(state.onboardPhase); }
}
// Email + password: try to sign in (returning user), else sign up (new user).
async function ob_emailAuth(){
  const sb = await sbEnsure(); // loads the Supabase UMD on this first auth use
  if(!sb){ state.ob_err='sign-in is offline right now — continue as guest to stay local.'; renderOnboard(state.onboardPhase); return; }
  const g = id => { const el = document.getElementById(id); return el ? (el.value||'').trim() : ''; };
  const name = g('obName'), email = g('obEmail'), password = (document.getElementById('obPassword')||{}).value || '';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ state.ob_err='enter a valid email.'; renderOnboard(state.onboardPhase); return; }
  if(password.length < 6){ state.ob_err='password must be at least 6 characters.'; renderOnboard(state.onboardPhase); return; }
  state.ob_authBusy=true; state.ob_err=null; state.ob_authMsg=null; renderOnboard(state.onboardPhase);
  try{
    let { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error && /invalid login credentials/i.test(error.message)){
      const res = await sb.auth.signUp({ email, password, options:{ data:{ full_name:name } } });
      data = res.data; error = res.error;
      if(!error && !(data && data.session)){ state.ob_authBusy=false; state.ob_authMsg='almost there — check your email to confirm, then sign in.'; renderOnboard(state.onboardPhase); return; }
    }
    if(error){ state.ob_authBusy=false; state.ob_err=error.message; renderOnboard(state.onboardPhase); return; }
    state.ob_authBusy=false;
    await ob_syncSupabaseAccount(data && data.session);
  }catch(e){ state.ob_authBusy=false; state.ob_err='couldn’t sign you in — try again.'; renderOnboard(state.onboardPhase); }
}
// Bridge a Supabase session into the local account record so the shell shows
// "signed in as", then continue onboarding.
async function ob_syncSupabaseAccount(session){
  const sb = sbClient(); if(!sb) return;
  let user = session && session.user;
  if(!user){ try{ const { data } = await sb.auth.getUser(); user = data && data.user; }catch(e){} }
  if(!user) return;
  const meta = user.user_metadata || {};
  const name = meta.full_name || meta.name || (user.email||'').split('@')[0] || 'you';
  try{ const r = await post('/api/signup', { provider:(user.app_metadata && user.app_metadata.provider) || 'email', name, email:user.email }); if(r && r.account) state.account = r.account; }catch(e){}
  state.ob_err=null; state.ob_authMsg=null;
  if(hasBrain()) enterApp(); else ob_nav('choice');
}
// Complete an OAuth redirect + pick up an existing session, once per load.
// The Supabase library is lazy-loaded, so first check whether THIS load could
// even have a session: an OAuth/PKCE redirect (?code= / #access_token) or a
// persisted sb-* token. If neither, skip the fetch entirely (guest path).
async function ob_checkSupabaseSession(){
  if(state.ob_sbChecked) return false; state.ob_sbChecked = true;
  const urlHasAuth = /[?&](code|error)=/.test(location.search) || /access_token=/.test(location.hash);
  let hasStored = false;
  try{ for(let i=0;i<localStorage.length;i++){ if(/^sb-.*-auth-token/.test(localStorage.key(i)||'')){ hasStored=true; break; } } }catch(e){}
  if(!urlHasAuth && !hasStored) return false;
  const sb = await sbEnsure(); if(!sb) return false;
  try{ const { data } = await sb.auth.getSession(); if(data && data.session){ await ob_syncSupabaseAccount(data.session); return true; } }catch(e){}
  return false;
}
async function ob_doInit(){
  try{
    const r = await post('/api/init', { path: state.ob_selected });
    if(r.error){ state.ob_err=r.error; renderOnboard(state.onboardPhase); return; }
    await loadOverview();
    state.ob_pairConfig=null; state.ob_setupMode = state.ob_createIntent || 'raw'; ob_nav('connect');
  }catch(e){ state.ob_err='couldn’t create the brain here.'; renderOnboard(state.onboardPhase); }
}
async function ob_doPair(){
  if(state.ob_pairing) return; // auto-triggered on the connect view — don't double-mint
  state.ob_pairing = true;
  const nm = (state.ob_agentName||'').trim() || 'My Assistant'; // user-named, else a sensible default
  try{ const r = await post('/api/pair', { id:'my-assistant', displayName:nm }); if(r.error){ state.ob_err=r.error; } else { state.ob_pairConfig = r.config; } }
  catch(e){ state.ob_err='couldn’t create the connection.'; }
  state.ob_pairing = false;
  renderOnboard(state.onboardPhase);
}

function ob_wire(){
  const el = $('#onboard');
  el.querySelectorAll('[data-ob-lang]').forEach(x=> x.onclick=()=>applyLang(x.dataset.obLang));
  el.querySelectorAll('[data-ob]').forEach(x=> x.onclick=()=>{
    const to = x.dataset.ob;
    if(to==='signup') ob_nav('signup');
    else if(to==='hero') ob_nav('hero');
    else if(to==='choice') ob_nav('choice');
    else if(to==='existing'){ state.ob_selected=null; state.ob_inspect=null; state.ob_err=null; ob_nav('existing'); }
    // raw + blank share the create-a-brain picker; the door chosen decides
    // which kickoff prompt the connect step hands the AI. Start with NO folder
    // selected (no default-to-home), so "use" stays disabled until a real pick.
    else if(to==='raw' || to==='blank' || to==='create'){ state.ob_createIntent = (to==='create') ? 'raw' : to; state.ob_selected=null; state.ob_inspect=null; state.ob_err=null; ob_nav('create'); }
    else if(to==='enter') enterApp();
    else if(to==='cancelIngest') ob_ingestCancel();
    else if(to==='signout'){ try{ const sb=sbClient(); if(sb) sb.auth.signOut(); }catch(e){} post('/api/signout',{}).then(()=>{ state.account=null; state.ob_sbChecked=false; ob_nav('hero'); }); }
  });
  el.querySelectorAll('[data-ob-signup]').forEach(x=> x.onclick=()=> ob_doSignup(x.dataset.obSignup));
  el.querySelectorAll('[data-ob-oauth]').forEach(x=> x.onclick=()=> ob_oauth(x.dataset.obOauth));
  const obEmailBtn = el.querySelector('[data-ob-email]'); if(obEmailBtn) obEmailBtn.onclick = ob_emailAuth;
  el.querySelectorAll('[data-ob-dir]').forEach(x=> x.onclick=()=> ob_selectDir(x.dataset.obDir));
  // paste-a-path box: jump straight to a typed/pasted folder (reuses ob_selectDir
  // so it navigates + inspects + enables "use" exactly like clicking a row).
  { const gotoBtn = el.querySelector('[data-ob-goto]'); const pathInp = el.querySelector('#obPath');
    const gotoPath = ()=>{ const v = pathInp && pathInp.value ? pathInp.value.trim() : ''; if(v) ob_selectDir(v); };
    if(gotoBtn) gotoBtn.onclick = gotoPath;
    if(pathInp) pathInp.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); gotoPath(); } }); }
  // the singular native "Select your folder" button → OS folder dialog
  { const pickBtn = el.querySelector('[data-ob-pick]'); if(pickBtn) pickBtn.onclick = ob_pickNative; }
  el.querySelectorAll('.ob-dir').forEach(x=>{ // hover via listeners (no path-in-handler XSS)
    x.addEventListener('mouseenter', ()=>{ if(x.dataset.obSel!=='1') x.style.background='var(--surface2)'; });
    x.addEventListener('mouseleave', ()=>{ if(x.dataset.obSel!=='1') x.style.background='transparent'; });
  });
  el.querySelectorAll('[data-ob-use]').forEach(x=> x.onclick=()=>{ if(x.hasAttribute('disabled'))return; if(x.dataset.obUse==='create') ob_doInit(); else ob_ingestStream(); });
  const pairBtn = el.querySelector('[data-ob-pair]'); if(pairBtn) pairBtn.onclick=ob_doPair;
  const doCopy = (btn, text)=>{ if(!text) return; const ok=()=>{ btn.textContent='✓'; }; if(navigator.clipboard){ navigator.clipboard.writeText(text).then(ok).catch(()=>{ try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); ok(); }catch(_){} }); } };
  const copyPrompt = el.querySelector('[data-ob-copyprompt]'); if(copyPrompt) copyPrompt.onclick=()=> doCopy(copyPrompt, ob_kickoffPrompt(state.ob_setupMode||'raw'));
  // the shared per-AI setup guide (client picker + MCP config + rules copy)
  // name-this-connection: keep the typed value in state (no rerender, keeps focus);
  // on blur, rename the auto-paired agent so it shows up under the user's own name.
  { const an = el.querySelector('#obAgentName'); if(an){
      an.addEventListener('input', ()=>{ state.ob_agentName = an.value; });
      an.addEventListener('blur', ()=>{ const nm=(an.value||'').trim(); if(nm && state.ob_pairConfig){ post('/api/rename', { id:'my-assistant', displayName:nm }).catch(()=>{}); } });
  } }
  if(el.querySelector('[data-guide-client]') && window.callosiumGuideWire) callosiumGuideWire(el, ob_serverSpec(), ()=>renderOnboard(state.onboardPhase));
}

// ===================== coach =====================
// ── Callosium · first-run "quick tour" coach-marks ──
// Guided spotlight bubbles that introduce the dashboard shell in a logical order.
// Contract: exposes global startCoach() (called by the app after first login) and
// window.startCoach (so a Settings "replay tour" can re-run it). Renders into the
// existing #coach overlay. Reuses shared globals (state, esc, px, nav, t); every
// helper here is namespaced coach_* and never redefines those globals.

// Bilingual: prefer the app's global t(en,ar); fall back to state.lang if it's absent
// so the tour still speaks the right language before t() ships. This does NOT redefine t.
function coach_t(en, ar){
  try{ if(typeof t === 'function') return t(en, ar); }catch(_){}
  return (typeof state === 'object' && state && state.lang === 'ar') ? ar : en;
}

const coach_TOUR_KEY = 'callosium_tour_v1';
const coach_state = { steps:[], idx:0, active:false, bound:false };
let coach_rzT = null;

// ── overlay ── (use the existing #coach; create it if the app hasn't yet, so replay always works)
function coach_overlay(){
  let ov = document.getElementById('coach');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'coach';
    ov.style.cssText = 'position:fixed;inset:0;z-index:70;display:none';
    (document.getElementById('app') || document.body).appendChild(ov);
  }
  return ov;
}

// ── live target resolvers ── (DOM re-renders between screens, so resolve on demand)
// Walk up to the element that is a direct child of #screen (used to grab whole rows).
function coach_childOfScreen(el){
  const screen = document.getElementById('screen');
  if(!screen || !el) return null;
  let cur = el;
  while(cur && cur.parentElement && cur.parentElement !== screen) cur = cur.parentElement;
  return (cur && cur.parentElement === screen) ? cur : null;
}
function coach_navRail(){ return document.querySelector('#app aside') || document.getElementById('nav'); }
function coach_vitals(){ return coach_childOfScreen(document.getElementById('vnum0')); }
function coach_terminal(){ const b = document.getElementById('termBody'); return b ? b.parentElement : null; }
function coach_partitions(){
  const term = coach_terminal();
  const grid = term && term.parentElement;      // the 1.4fr / 1fr row
  return grid ? (grid.children[1] || null) : null; // partitions is the second panel
}
function coach_quickActions(){
  const btn = document.querySelector('#screen .qa-hot, #screen .qa');
  return btn ? btn.parentElement : null;         // the quick-action button row
}
function coach_search(){ return document.getElementById('search'); }
function coach_reindex(){ return document.getElementById('reindexBtn'); }

// ── step definitions ── (title/body are functions so t() re-evaluates per current lang)
function coach_buildSteps(){
  return [
    { target: coach_navRail,
      title: ()=>coach_t('your destinations','وجهاتك'),
      body:  ()=>coach_t('seven destinations — click any to move around.',
                         'سبع وجهات — انقر أيّها للتنقل.') },
    { target: coach_vitals,
      title: ()=>coach_t("your brain's vitals",'مؤشّرات دماغك'),
      body:  ()=>coach_t("your brain's vitals at a glance.",
                         'مؤشّرات دماغك الحيوية بلمحة واحدة.') },
    { target: coach_terminal,
      title: ()=>coach_t('live activity','النشاط الحيّ'),
      body:  ()=>coach_t('everything your AIs do, live — click any line to jump to that note.',
                         'كل ما تفعله أدواتك الذكية، مباشرةً — انقر أيّ سطر للانتقال إلى تلك الملاحظة.') },
    { target: coach_partitions,
      title: ()=>coach_t('your folders','مجلّداتك'),
      body:  ()=>coach_t('your folders — Private stays yours alone.',
                         'مجلّداتك — يبقى «الخاص» لك وحدك.') },
    { target: coach_quickActions,
      title: ()=>coach_t('quick actions','إجراءات سريعة'),
      body:  ()=>coach_t('one-tap shortcuts to get things done.',
                         'اختصارات بنقرة واحدة لإنجاز الأمور.') },
    { target: coach_search,
      title: ()=>coach_t('search your brain','ابحث في دماغك'),
      body:  ()=>coach_t('search, or press Enter to Ask your brain.',
                         'ابحث، أو اضغط Enter لتسأل دماغك.') },
    { target: coach_reindex,
      title: ()=>coach_t('re-index','إعادة الفهرسة'),
      body:  ()=>coach_t('rebuild the index after big changes.',
                         'أعد بناء الفهرس بعد التغييرات الكبيرة.') },
    { final: true,
      title: ()=>coach_t("that's the tour",'انتهت الجولة'),
      body:  ()=>coach_t('explore freely — everything stays on this device.',
                         'استكشف بحرية — كل شيء يبقى على هذا الجهاز.') },
  ];
}

// ── counters ── (only spotlight steps are numbered; the final card is a summary)
function coach_spotlightCount(){ return coach_state.steps.filter(s=>!s.final).length; }
function coach_spotlightIndex(){
  let c = 0;
  for(let i=0;i<coach_state.idx;i++){ if(!coach_state.steps[i].final) c++; }
  return c;
}

// ── entry point ──
function startCoach(){
  // Overview must be the active, rendered screen before we can point at its panels.
  if(typeof state === 'object' && state && state.screen !== 'overview' && typeof nav === 'function'){
    nav('overview');
  }
  // Build the run, dropping spotlight steps whose target isn't on screen right now.
  const all = coach_buildSteps();
  const kept = all.filter(s => s.final || (typeof s.target === 'function' && s.target()));
  coach_state.steps = kept.length ? kept : all.filter(s=>s.final);
  coach_state.idx = 0;
  coach_state.active = true;

  const ov = coach_overlay();
  ov.innerHTML = '';
  ov.style.display = 'block';
  ov.style.pointerEvents = 'auto';   // capture clicks so the app is inert during the tour
  // a11y: the tour is a modal dialog: focus moves into the bubble, the app
  // behind leaves the tab order (inert), Escape dismisses, focus returns on close.
  coach_state.invoker = document.activeElement;
  const shell = document.getElementById('shellMain');
  if(shell){ try{ shell.inert = true; }catch(_){} shell.setAttribute('inert',''); }
  const skip = document.getElementById('skipLink');
  if(skip){ try{ skip.inert = true; }catch(_){} skip.setAttribute('inert',''); }
  ov.setAttribute('role','dialog');
  ov.setAttribute('aria-modal','true');
  ov.setAttribute('aria-label', coach_t('quick tour','جولة سريعة'));
  ov.setAttribute('tabindex','-1');

  if(!coach_state.bound){
    window.addEventListener('keydown', coach_onKey, true);
    window.addEventListener('resize', coach_onResize);
    coach_state.bound = true;
  }
  coach_render();
}
window.startCoach = startCoach;

// ── render the current step ──
function coach_render(){
  if(!coach_state.active) return;
  const ov = coach_overlay();
  const step = coach_state.steps[coach_state.idx];
  if(!step){ coach_finish(); return; }

  let scrim = ov.querySelector('.coach-scrim');
  if(!scrim){ scrim = document.createElement('div'); scrim.className = 'coach-scrim'; ov.appendChild(scrim); }

  if(step.final){ coach_renderFinal(ov, scrim, step); coach_focusStep(); return; }

  const el = step.target && step.target();
  if(!el){ coach_advance(1); return; }           // vanished since start — skip gracefully

  try{ el.scrollIntoView({ block:'nearest', inline:'nearest' }); }catch(_){}
  const rect = el.getBoundingClientRect();
  coach_paintScrim(scrim, rect);
  coach_paintBubble(ov, step, rect);
  coach_focusStep();
}

// move keyboard focus to the step's primary action so the dialog is operable
// the moment it appears (the window-level key handler keeps ←/→/Esc working).
function coach_focusStep(){
  const ov = document.getElementById('coach'); if(!ov) return;
  const btn = ov.querySelector('.coach-next') || ov.querySelector('.coach-done') || ov.querySelector('.coach-skip');
  if(btn){ try{ btn.focus({preventScroll:true}); }catch(_){ } }
}

// Spotlight = a padded rect over the target; the massive box-shadow dims everything
// outside it (the "hole"), and the synapse ring + glow frames it. Transitions animate
// the box gliding from one target to the next for a calm feel.
function coach_paintScrim(scrim, rect){
  const pad = 6;
  const sx = Math.max(0, rect.left - pad), sy = Math.max(0, rect.top - pad);
  const sw = Math.min(window.innerWidth, rect.right + pad) - sx;
  const sh = Math.min(window.innerHeight, rect.bottom + pad) - sy;
  scrim.style.cssText =
    'position:fixed;left:'+sx+'px;top:'+sy+'px;width:'+sw+'px;height:'+sh+'px;'
    + 'border-radius:0;pointer-events:none;z-index:1;'
    + 'box-shadow:0 0 0 9999px rgba(4,3,8,.72),0 0 0 2px var(--synapse),0 0 26px -2px var(--synapse);'
    + 'transition:left .3s cubic-bezier(.4,0,.2,1),top .3s cubic-bezier(.4,0,.2,1),'
    + 'width .3s cubic-bezier(.4,0,.2,1),height .3s cubic-bezier(.4,0,.2,1)';
}

function coach_btnStyle(primary){
  const base = 'font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;'
    + 'padding:7px 13px;border-radius:0;cursor:pointer;transition:.14s;';
  return base + (primary
    ? 'border:1px solid var(--synapse);background:var(--synapse);color:var(--on-accent);font-weight:600;'
    : 'border:1px solid var(--edge2);background:transparent;color:var(--dust);');
}

function coach_bubbleHTML(step){
  const isRTL = typeof state === 'object' && state && state.lang === 'ar';
  const counter = (coach_spotlightIndex()+1) + ' / ' + coach_spotlightCount();
  const showBack = coach_state.idx > 0;
  return '<div class="coach-bubble" dir="'+(isRTL?'rtl':'ltr')+'" style="position:fixed;z-index:2;'
    + 'max-width:300px;width:max-content;background:var(--surface);border:1px solid var(--edge2);'
    + 'border-radius:0;box-shadow:0 24px 60px -24px rgba(0,0,0,.85);padding:15px 16px 13px;'
    + 'opacity:0;animation:rise .32s ease forwards;font-family:var(--sans)">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
        + '<span style="width:7px;height:7px;border-radius:50%;background:var(--synapse);box-shadow:0 0 9px var(--synapse)"></span>'
        + '<span style="font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)">'+esc(counter)+'</span>'
      + '</div>'
      + '<div style="font-family:var(--pixel);font-weight:700;font-size:18px;letter-spacing:.01em;line-height:1.15;color:var(--starlight);margin-bottom:6px">'+esc(step.title())+'</div>'
      + '<div style="font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--dust)">'+esc(step.body())+'</div>'
      + '<div style="display:flex;align-items:center;gap:8px;margin-top:14px">'
        + '<button class="coach-skip" style="'+coach_btnStyle(false)+'">'+esc(coach_t('skip tour','تخطّي الجولة'))+'</button>'
        + '<span style="flex:1"></span>'
        + (showBack ? '<button class="coach-back" style="'+coach_btnStyle(false)+'">'+esc(coach_t('back','رجوع'))+'</button>' : '')
        + '<button class="coach-next" style="'+coach_btnStyle(true)+'">'+esc(coach_t('next','التالي'))+'</button>'
      + '</div>'
    + '</div>';
}

function coach_paintBubble(ov, step, rect){
  const old = ov.querySelector('.coach-bubble'); if(old) old.remove();
  const holder = document.createElement('div');
  holder.innerHTML = coach_bubbleHTML(step);
  const bubble = holder.firstElementChild;
  ov.appendChild(bubble);
  coach_bindButtons(bubble);
  coach_positionBubble(bubble, rect);
}

// Place the bubble adjacent to the target; auto-flip to whichever side has room.
function coach_positionBubble(bubble, rect){
  const gap = 14, vw = window.innerWidth, vh = window.innerHeight;
  const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
  const below = vh - rect.bottom, above = rect.top, right = vw - rect.right, left = rect.left;
  let side;
  if(below >= bh + gap) side = 'bottom';
  else if(above >= bh + gap) side = 'top';
  else if(right >= bw + gap) side = 'right';
  else if(left  >= bw + gap) side = 'left';
  else { const m = Math.max(below, above, right, left);
    side = m===below?'bottom':m===above?'top':m===right?'right':'left'; }

  let x, y;
  if(side==='bottom' || side==='top'){
    x = rect.left + rect.width/2 - bw/2;
    y = side==='bottom' ? rect.bottom + gap : rect.top - bh - gap;
  } else {
    x = side==='right' ? rect.right + gap : rect.left - bw - gap;
    y = rect.top + rect.height/2 - bh/2;
  }
  x = Math.max(gap, Math.min(x, vw - bw - gap));
  y = Math.max(gap, Math.min(y, vh - bh - gap));
  bubble.style.left = x + 'px';
  bubble.style.top  = y + 'px';
  coach_placeArrow(bubble, side, rect, x, y, bw, bh);
}

// A small rotated square that points from the bubble back to the target.
function coach_placeArrow(bubble, side, rect, x, y, bw, bh){
  const S = 10, half = S/2;
  const a = document.createElement('div');
  a.style.cssText = 'position:absolute;width:'+S+'px;height:'+S+'px;background:var(--surface);transform:rotate(45deg)';
  const clamp = (v, max) => Math.max(10, Math.min(v, max - 20));
  if(side==='bottom'){
    a.style.top = (-half)+'px'; a.style.borderLeft='1px solid var(--edge)'; a.style.borderTop='1px solid var(--edge)';
    a.style.left = clamp(rect.left + rect.width/2 - x - half, bw)+'px';
  } else if(side==='top'){
    a.style.bottom = (-half)+'px'; a.style.borderRight='1px solid var(--edge)'; a.style.borderBottom='1px solid var(--edge)';
    a.style.left = clamp(rect.left + rect.width/2 - x - half, bw)+'px';
  } else if(side==='right'){
    a.style.left = (-half)+'px'; a.style.borderLeft='1px solid var(--edge)'; a.style.borderBottom='1px solid var(--edge)';
    a.style.top = clamp(rect.top + rect.height/2 - y - half, bh)+'px';
  } else {
    a.style.right = (-half)+'px'; a.style.borderRight='1px solid var(--edge)'; a.style.borderTop='1px solid var(--edge)';
    a.style.top = clamp(rect.top + rect.height/2 - y - half, bh)+'px';
  }
  bubble.appendChild(a);
}

// ── final centered card ──
function coach_renderFinal(ov, scrim, step){
  const isRTL = typeof state === 'object' && state && state.lang === 'ar';
  scrim.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;'
    + 'background:rgba(4,3,8,.72);z-index:1;pointer-events:none;box-shadow:none';
  const old = ov.querySelector('.coach-bubble'); if(old) old.remove();
  const holder = document.createElement('div');
  const icon = (typeof px === 'function') ? px('overview', 20) : '';
  holder.innerHTML =
    '<div class="coach-bubble" dir="'+(isRTL?'rtl':'ltr')+'" style="position:fixed;left:50%;top:50%;'
    + 'transform:translate(-50%,-50%);z-index:2;width:min(90vw,380px);text-align:center;'
    + 'background:var(--surface);border:1px solid var(--edge2);border-radius:0;'
    + 'box-shadow:0 40px 90px -30px rgba(0,0,0,.9);padding:28px 26px 24px;opacity:0;animation:rise .34s ease forwards">'
      + '<div style="width:44px;height:44px;border:1px solid var(--edge2);border-radius:0;display:flex;'
        + 'align-items:center;justify-content:center;margin:0 auto 16px;background:var(--surface2);--icon:var(--synapse)">'+icon+'</div>'
      + '<div style="font-family:var(--pixel);font-weight:700;font-size:24px;line-height:1.1;color:var(--starlight);margin-bottom:8px">'+esc(step.title())+'</div>'
      + '<div style="font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--dust);margin-bottom:20px">'+esc(step.body())+'</div>'
      + '<button class="coach-done" style="'+coach_btnStyle(true)+'width:100%;padding:11px">'+esc(coach_t('done','تم'))+'</button>'
    + '</div>';
  const bubble = holder.firstElementChild;
  ov.appendChild(bubble);
  const done = bubble.querySelector('.coach-done'); if(done) done.onclick = coach_finish;
}

// ── button wiring ──
function coach_bindButtons(bubble){
  const n = bubble.querySelector('.coach-next'); if(n) n.onclick = coach_next;
  const b = bubble.querySelector('.coach-back'); if(b) b.onclick = coach_back;
  const s = bubble.querySelector('.coach-skip'); if(s) s.onclick = coach_skip;
}

// ── navigation ──
function coach_next(){ coach_advance(1); }
function coach_back(){ coach_advance(-1); }
function coach_advance(dir){
  let i = coach_state.idx + dir;
  while(i >= 0 && i < coach_state.steps.length){
    const s = coach_state.steps[i];
    if(s.final || (s.target && s.target())) break;   // skip steps whose target is gone
    i += dir;
  }
  if(i < 0) i = 0;
  if(i >= coach_state.steps.length){ coach_finish(); return; }
  coach_state.idx = i;
  coach_render();
}

function coach_skip(){ coach_end(); }
function coach_finish(){ coach_end(); }
function coach_end(){
  coach_state.active = false;
  const ov = document.getElementById('coach');
  if(ov){ ov.style.display = 'none'; ov.style.pointerEvents = ''; ov.innerHTML = ''; ov.removeAttribute('role'); ov.removeAttribute('aria-modal'); ov.removeAttribute('aria-label'); }
  if(coach_state.bound){
    window.removeEventListener('keydown', coach_onKey, true);
    window.removeEventListener('resize', coach_onResize);
    coach_state.bound = false;
  }
  try{ localStorage.setItem(coach_TOUR_KEY, '1'); }catch(_){}  // never auto-show again
  // lift the app out of inert, then put focus back where the tour found it
  // (auto-launch had no invoker, so the search box is the sensible home).
  const shell = document.getElementById('shellMain');
  if(shell){ try{ shell.inert = false; }catch(_){} shell.removeAttribute('inert'); }
  const skip = document.getElementById('skipLink');
  if(skip){ try{ skip.inert = false; }catch(_){} skip.removeAttribute('inert'); }
  const inv = coach_state.invoker; coach_state.invoker = null;
  const fallback = document.getElementById('search');
  const tgt = (inv && inv !== document.body && document.contains(inv)) ? inv : fallback;
  if(tgt && document.contains(tgt)){ try{ tgt.focus({preventScroll:true}); }catch(_){ } }
}

// ── keyboard: Esc = skip · → = next · ← = back · Tab trapped in the bubble ·
// Enter on a bubble button activates that button natively (Enter elsewhere
// still advances) ──
function coach_onKey(e){
  if(!coach_state.active) return;
  const onBtn = e.target && e.target.closest && e.target.closest('#coach button');
  if(e.key === 'Escape'){ e.preventDefault(); coach_skip(); }
  else if(e.key === 'Tab'){
    // inert strips the app from the tab order, but Chrome still wraps through
    // BODY between cycles, so trap Tab inside the bubble's own buttons instead.
    const ov = document.getElementById('coach'); if(!ov) return;
    const f = [...ov.querySelectorAll('button:not([disabled])')].filter(el=>el.getClientRects().length);
    if(!f.length) return;
    const first = f[0], last = f[f.length-1], active = document.activeElement;
    if(e.shiftKey && (active===first || !ov.contains(active))){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && (active===last || !ov.contains(active))){ e.preventDefault(); first.focus(); }
  }
  else if(e.key === 'ArrowRight'){
    e.preventDefault();
    const step = coach_state.steps[coach_state.idx];
    if(step && step.final) coach_finish(); else coach_next();
  }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); coach_back(); }
  else if(e.key === 'Enter' && !onBtn){
    e.preventDefault();
    const step = coach_state.steps[coach_state.idx];
    if(step && step.final) coach_finish(); else coach_next();
  }
}

// ── re-measure on resize (debounced) ──
function coach_onResize(){
  if(!coach_state.active) return;
  clearTimeout(coach_rzT);
  coach_rzT = setTimeout(coach_render, 120);
}


// ── boot ──
// ── account + onboarding gating ──
async function loadAccount(){ try{ const r=await api('/api/account'); if(r && r.httpStatus){ state.account=null; state.accountFailed=true; return; } state.account = r && r.account || null; state.accountFailed=false; }catch(e){ state.account=null; state.accountFailed=true; } }
function hasBrain(){ return !!(state.overview && state.overview.onboarded); }
function showOnboard(phase){
  state.onboardPhase = phase;
  const el = $('#onboard'); el.style.display='block';
  if(window.renderOnboard) renderOnboard(phase);
  else el.innerHTML='<div style="padding:60px;text-align:center;font-family:var(--mono);color:var(--faint)">loading…</div>';
}
const TOUR_KEY = 'callosium_tour_v1';
function maybeTour(delay){ if(window.startCoach && !localStorage.getItem(TOUR_KEY)){ setTimeout(()=>{ try{ startCoach(); }catch(e){} }, delay||800); } }
// The 20s live refresh — registered ONCE, from whichever path lands in the app
// (returning users via boot, first-run users via enterApp).
let liveRefreshOn = false;
function startLiveRefresh(){
  if(liveRefreshOn) return; liveRefreshOn = true;
  setInterval(async()=>{ if(state.screen==='overview' && !state.reindexing && $('#onboard').style.display==='none'){ await loadActivity(); await loadOverview(); render(); } }, 20000);
}
// Background update check — throttled to once per interval via a localStorage
// timestamp so we don't hit GitHub on every load. Populates state.st_update (so
// Settings shows the result without a manual click) and raises a nav badge when
// a newer version exists. Never throws into boot — offline is a no-op.
const UPDATE_CHECK_MS = 6*60*60*1000; // 6h
async function maybeCheckUpdate(force){
  try{
    const last = +(localStorage.getItem('callosium_last_update_check')||0);
    if(!force && Date.now()-last < UPDATE_CHECK_MS) {
      // still surface a badge + banner from the cached result on this load
      if(state.st_update && state.st_update.updateAvailable){ state.updateBadge=true; renderNav(); }
      renderUpdateBanner();
      return;
    }
    const r = await api('/api/update/check');
    localStorage.setItem('callosium_last_update_check', String(Date.now()));
    state.st_update = r;
    if(r && r.updateAvailable){ state.updateBadge = true; renderNav(); }
    renderUpdateBanner();
  }catch(e){ /* offline / unreachable — ignore, Settings can retry manually */ }
}
// Shared "update" action for the Settings button AND the top banner. On desktop it
// hands off to the native Tauri updater (a same-origin signal the shell polls); on
// npm/npx there is no bundled updater, so it opens the releases page.
async function doUpdate(btn){
  const onDesktop = !!(state.st_update && state.st_update.desktop);
  if(onDesktop){
    if(btn) btn.disabled = true;
    let r=null; try{ r = await post('/api/desktop/update'); }catch(_){}
    if(!r || r.queued!==true){ if(btn) btn.disabled=false; window.open('https://github.com/callosium/callosium/releases','_blank','noopener'); }
    // on success the native shell shows an "Install & restart?" dialog and takes over
    return;
  }
  // npm / npx: run the real update IN the app (no browser tab). A running Node CLI can't
  // hot-swap its own process, so on success we ask for a one-line restart.
  if(state.st_updating) return;
  state.st_updating = true; state.st_updateResult = null;
  if(btn){ btn.disabled = true; btn.dataset.o = btn.textContent; btn.textContent = t('updating…','...تحديث'); }
  if(typeof renderUpdateBanner==='function') renderUpdateBanner();
  if(state.screen==='settings') render();
  announce(t('updating Callosium — running npm, this can take up to a minute','جارٍ تحديث كالوسيوم'));
  let r=null; try{ r = await post('/api/self-update'); }catch(_){ r = { ok:false, error:'could not reach the updater' }; }
  state.st_updating = false;
  state.st_updateResult = r || { ok:false, error:'could not reach the updater' };
  const latest = (state.st_update && state.st_update.latest) || 'latest';
  announce(r && r.ok ? t('updated to v'+latest+' — restart Callosium to finish','تم التحديث — أعد تشغيل كالوسيوم') : t('update failed — '+((r&&r.error)||'unknown error'),'فشل التحديث'));
  if(state.screen==='settings') render();
  if(typeof renderUpdateBanner==='function') renderUpdateBanner();
}
// Persistent top banner while an update is available. Lives on <body>, so it
// survives screen re-renders; the × dismisses it for this session (returns on next
// launch). Shrinks #app beneath it so it never covers the header/nav.
function renderUpdateBanner(){
  const app = document.getElementById('app');
  const show = !!(state.st_update && state.st_update.updateAvailable) && !state.updateBannerDismissed;
  let el = document.getElementById('calUpdateBanner');
  if(!show){ if(el) el.remove(); __layoutBanners(); return; }
  const ver = (state.st_update && state.st_update.latest) ? ' (v'+state.st_update.latest+')' : '';
  if(!el){
    el = document.createElement('div');
    el.id = 'calUpdateBanner';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:9px 16px;background:var(--amber,#E8A317);color:#0b0a0f;font-family:var(--mono,monospace);font-size:13px;box-shadow:0 2px 12px rgba(0,0,0,.45)';
    document.body.appendChild(el);
  }
  el.textContent = '';
  const updating = !!state.st_updating, res = state.st_updateResult;
  const msg = document.createElement('span');
  msg.style.fontWeight = '500';
  const btn = document.createElement('button');
  btn.style.cssText = 'background:#0b0a0f;color:var(--amber,#E8A317);border:none;padding:7px 16px;font-family:var(--mono,monospace);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer';
  let showBtn = true;
  if(updating){
    msg.textContent = t('Updating Callosium — running npm…','جارٍ تحديث كالوسيوم…');
    btn.textContent = t('updating…','...تحديث'); btn.disabled = true; btn.style.opacity = '.6'; btn.style.cursor = 'default';
  } else if(res && res.ok){
    msg.textContent = t('Updated'+ver+' — restart Callosium to finish.','تم التحديث — أعد تشغيل كالوسيوم.'); showBtn = false;
  } else if(res && !res.ok){
    msg.textContent = t("Update didn't complete — "+(res.error||'please try again')+'.',"لم يكتمل التحديث.");
    btn.textContent = t('Try again','أعد المحاولة'); btn.onclick = ()=> doUpdate(btn);
  } else {
    msg.textContent = t('A new version of Callosium is available'+ver+'.', 'يتوفّر إصدار جديد من كالوسيوم'+ver+'.');
    btn.textContent = t('Update now','حدّث الآن'); btn.onclick = ()=> doUpdate(btn);
  }
  const x = document.createElement('button');
  x.textContent = '✕'; x.title = t('dismiss for now','إخفاء الآن'); x.setAttribute('aria-label','dismiss');
  x.style.cssText = 'background:transparent;border:none;color:#0b0a0f;font-size:15px;line-height:1;cursor:pointer;padding:2px 6px;opacity:.85';
  x.onclick = ()=>{ state.updateBannerDismissed = true; renderUpdateBanner(); };
  el.appendChild(msg); if(showBtn) el.appendChild(btn); el.appendChild(x);
  requestAnimationFrame(()=>{ try{ __layoutBanners(); }catch(_){} });
}
// Stacks the fixed top banners (update + index) and reserves exactly their
// combined height under #app, so neither covers the header and they never fight
// over the same margin. Called by BOTH banners whenever one mounts/unmounts.
function __layoutBanners(){
  const app = document.getElementById('app');
  const up = document.getElementById('calUpdateBanner');
  const ix = document.getElementById('calIndexBanner');
  let top = 0;
  if(up){ up.style.top = top+'px'; top += up.offsetHeight; }
  if(ix){ ix.style.top = top+'px'; top += ix.offsetHeight; }
  if(app){ if(top>0){ app.style.marginTop = top+'px'; app.style.height = 'calc(100vh - '+top+'px)'; } else { app.style.marginTop=''; app.style.height=''; } }
}
// Persistent "building smarter search" indicator. Lives on <body> like the update
// banner, so it survives screen re-renders (indexing continues while the user
// navigates). Real X/Y chunk counts while building; a one-time model-download line
// on first run; a distinct "semantic unavailable" state on error. NO em dashes —
// a middot separator, matching the ingest progress copy.
function renderIndexBanner(){
  const e = state.embed || {};
  const building = e.status==='building';
  // Error surfaces from EITHER a failed background build (e.status) OR a failed LOAD
  // of an EXISTING sidecar (overview.semanticError — a torn/corrupt/mismatched cache),
  // so a returning user with a broken index sees the actionable banner, not a silent
  // drop to keyword-only.
  const error = !building && (e.status==='error' || !!state.semanticError) && !state.embedBannerDismissed;
  // a transient green "✓ ready" flip the moment a build finishes, so completion is
  // visible instead of the banner just vanishing. startEmbedPoll sets/clears the flag.
  const done = !building && !error && !!state.embedJustDone;
  const show = building || error || done;
  let el = document.getElementById('calIndexBanner');
  if(!show){ if(el) el.remove(); __layoutBanners(); return; }
  const mode = error ? 'error' : done ? 'done' : 'building';
  // (Re)build the STRUCTURE only on first mount or an error<->building switch. Every
  // ~2.5s status poll then only updates the text + bar width, so the shimmer animation
  // runs UNINTERRUPTED (rebuilding it each poll would reset it and look stuttery).
  if(!el || el.dataset.mode !== mode){
    if(el) el.remove();
    if(!document.getElementById('calBannerKf')){
      const kf = document.createElement('style'); kf.id='calBannerKf';
      kf.textContent = '@keyframes calShimmer{0%{transform:translateX(-140%)}100%{transform:translateX(320%)}}';
      document.head.appendChild(kf);
    }
    el = document.createElement('div');
    el.id = 'calIndexBanner'; el.dataset.mode = mode;
    el.style.cssText = 'position:fixed;left:0;right:0;z-index:99998;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:8px 16px;font-family:var(--mono,monospace);font-size:12.5px;color:var(--on-accent,#07060B);box-shadow:0 2px 12px rgba(0,0,0,.35);background:'+(error?'var(--danger,#FF3355)':done?'var(--acid,#52F2B8)':'var(--synapse,#FF2E88)');
    const msgEl = document.createElement('span'); msgEl.id='calBannerMsg'; msgEl.style.fontWeight='500';
    el.appendChild(msgEl);
    if(error){
      const x = document.createElement('button');
      x.textContent = '✕'; x.title = t('dismiss','إخفاء'); x.setAttribute('aria-label','dismiss');
      x.style.cssText = 'background:transparent;border:none;color:var(--on-accent,#07060B);font-size:14px;line-height:1;cursor:pointer;padding:2px 6px;opacity:.85';
      x.onclick = ()=>{ state.embedBannerDismissed = true; renderIndexBanner(); };
      el.appendChild(x);
    } else if(!done){
      // progress bar pinned to the banner's bottom edge: a real fill (done/total, or the
      // model-download %) PLUS a continuously sliding shimmer, so it ALWAYS looks alive —
      // even in the seconds between the batch-sized count jumps.
      const track = document.createElement('div');
      track.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.20);overflow:hidden';
      const fill = document.createElement('div'); fill.id='calBannerFill';
      fill.style.cssText = 'height:100%;width:8%;background:var(--on-accent,#07060B);opacity:.9;transition:width .5s ease';
      const shim = document.createElement('div');
      shim.style.cssText = 'position:absolute;top:0;bottom:0;width:32%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:calShimmer 1.15s linear infinite';
      track.appendChild(fill); track.appendChild(shim); el.appendChild(track);
    }
    document.body.appendChild(el);
  }
  // Per-poll update: text + bar width only (never touches the running shimmer).
  const msg = document.getElementById('calBannerMsg');
  if(error){
    if(msg) msg.textContent = t('semantic search unavailable · keyword search works · re-index to retry','البحث الدلالي غير متاح · البحث بالكلمات يعمل · أعد الفهرسة');
  } else if(done){
    if(msg) msg.textContent = t('✓ smarter search is ready','✓ البحث الذكي جاهز');
  } else {
    let pct = null, txt;
    if(e.phase==='model' && e.modelPct!=null){
      pct = e.modelPct;
      txt = t('getting smarter search ready · downloading language model','نجهّز البحث الذكي · تنزيل النموذج اللغوي')+' '+e.modelPct+'%';
    } else if(e.total>0){
      pct = Math.min(99, Math.floor(e.done/e.total*100)); // never 100% until it's actually done
      txt = t('building smarter search','نُحسّن بحثك')+' · '+e.done.toLocaleString()+' / '+e.total.toLocaleString()+' · '+pct+'%';
    } else {
      txt = t('building smarter search','نُحسّن بحثك')+' …';
    }
    if(msg) msg.textContent = txt;
    const fill = document.getElementById('calBannerFill');
    if(fill && pct!=null) fill.style.width = pct+'%';
  }
  requestAnimationFrame(()=>{ try{ __layoutBanners(); }catch(_){} });
}
// Poll /api/embed/status (~2.5s) while a background build runs; self-clears when it
// leaves 'building'. Guarded by a flag so repeated starts (boot re-entry, every
// re-index) never stack intervals. Re-callable: after it self-clears on done/error,
// a later re-index starts a fresh poll.
let embedPollOn = false;
function startEmbedPoll(){
  if(embedPollOn) return; embedPollOn = true;
  state.embedBannerDismissed = false; // a new build clears a prior dismissed error
  const iv = setInterval(async ()=>{
    let r; try{ r = await api('/api/embed/status'); }catch(_){ return; } // transient — keep polling
    if(r && r.httpStatus){ return; }                                     // server said no — keep polling
    state.embed = r;
    if(r.status==='done') state.semanticError = null; // a successful build clears any prior load-error banner
    renderIndexBanner();
    if(r.status!=='building'){
      clearInterval(iv); embedPollOn = false;
      // Refresh the cockpit whenever a build FINISHED — even if it completed so fast the
      // poll never sampled 'building' (small brain + warm model). A returning user with an
      // existing cache reports 'idle', not 'done', so this never fires spuriously.
      if(r.status==='done'){
        state.embedJustDone = true; renderIndexBanner();          // flip to the green "✓ ready" state
        try{ await loadOverview(); if(state.screen==='overview' && $('#onboard').style.display==='none') render(); }catch(_){}
        setTimeout(()=>{ state.embedJustDone = false; renderIndexBanner(); }, 4200); // then retire it
      }
    }
  }, 2500);
}
// transient-failure retry (don't dump an existing user into onboarding on a blip)
function showRetry(){
  const el = $('#onboard'); el.style.display='block';
  el.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px">'
    + '<div style="font-family:var(--pixel);font-weight:700;font-size:26px;margin-bottom:10px">'+t('can’t reach your brain','تعذّر الوصول إلى دماغك')+'</div>'
    + '<p style="color:var(--dust);font-size:14px;max-width:44ch;margin-bottom:22px">'+t('the local engine didn’t answer just now — your notes are safe on disk.','لم يستجب المحرك المحلي الآن — ملاحظاتك آمنة على القرص.')+'</p>'
    + '<button id="obRetry" style="font-family:var(--pixel);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--synapse);color:var(--synapse-ink);background:transparent;padding:12px 24px;border-radius:0;cursor:pointer">'+t('try again','أعد المحاولة')+'</button></div>';
  const b=$('#obRetry'); if(b) b.onclick=()=>{ el.style.display='none'; boot(); };
}

// called by the onboarding module when the user is signed in AND a brain is connected
async function enterApp(){
  await loadAccount(); await loadOverview(); await loadActivity();
  $('#onboard').style.display='none';
  state.screen='overview'; renderNav(); render();
  startLiveRefresh();
  startEmbedPoll();
  maybeCheckUpdate();
  maybeTour(800);
}

// One-time shell init: the neural-web rAF loop (startWeb; the vital-sparks
// loop binds per-render from renderOverview), the 1s clock interval, and the
// global #search listener must run EXACTLY once.
// boot() is re-entrant — showRetry()'s "try again" calls it again after a
// transient engine blip, precisely the path a user retries repeatedly — so
// guard these or each retry stacks another rAF loop, clock timer, and duplicate
// keydown handler (Enter would then fire nav('ask') N times).
let shellInited = false;
function initShellOnce(){
  if(shellInited) return; shellInited = true;
  // seed state.theme from what the pre-paint boot script applied to data-theme
  state.theme = ($('#app').getAttribute('data-theme')==='light') ? 'light' : 'dark';
  startWeb();
  tick(); setInterval(tick,1000);
  try{
    // reduced motion = the app's persisted toggle OR the OS preference. The OS
    // setting is honored live: flipping it mid-session re-applies immediately.
    const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    const applyRM = ()=>{
      let saved = false;
      try{ saved = localStorage.getItem('callosium_reduce_motion')==='1'; }catch(e){}
      window.__reduceMotion = saved || !!(mq && mq.matches);
      const app = document.getElementById('app');
      if(app){ if(window.__reduceMotion) app.setAttribute('data-reduce-motion','1'); else app.removeAttribute('data-reduce-motion'); }
    };
    applyRM();
    if(mq && mq.addEventListener) mq.addEventListener('change', applyRM);
  }catch(e){}
  $('#themeBtn').onclick=toggleTheme;
  $('#reindexBtn').onclick=reindex;
  // Enter in the shell search hands the typed query to the Ask composer (design
  // audit I8: it used to open Ask and silently discard what was typed).
  $('#search').addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    const q = e.target.value.trim();
    if(q) state.ak_prefill = q;
    e.target.value = '';
    nav('ask');
  });
}
async function boot(){
  renderNav();
  initShellOnce();
  $('#screen').innerHTML='<div style="font-family:var(--mono);color:var(--faint);padding:20px">connecting…</div>';
  // ?onboard=<view> — preview any onboarding view (welcome|signup|choice|
  // existing|create|connect) without touching the signed-in account. Used for
  // design review and demo captures; auto-pairing is disabled in preview so a
  // look never mints a real agent token.
  {
    const pv = new URLSearchParams(location.search).get('onboard');
    if(pv){
      state.ob_preview = true;
      const views = ['hero','signup','choice','existing','create','connect'];
      state.ob_view = views.includes(pv) ? pv : 'hero';
      if(state.ob_view==='connect') state.ob_setupMode = new URLSearchParams(location.search).get('mode') || 'blank';
      showOnboard(['choice','existing','create','connect'].includes(state.ob_view) ? 'setup' : 'welcome');
      return;
    }
  }
  await loadAccount();
  // Complete an OAuth sign-in (?code= in the URL) or restore a stored Supabase
  // session before routing — otherwise a fresh Google login lands back on the
  // welcome screen with the code unspent (ob_checkSupabaseSession routes on success).
  if(!state.account && typeof ob_checkSupabaseSession==='function'){
    try{ if(await ob_checkSupabaseSession()) return; }catch(_){}
    try{ await loadAccount(); }catch(_){}
  }
  await loadOverview(); await loadActivity();
  // gate: distinguish "genuinely no account" from "couldn't reach the engine".
  // A transient account OR overview failure must offer a retry — never re-onboard
  // an already-set-up user just because a request blipped on load.
  if(!state.account){ if(state.accountFailed){ showRetry(); return; } showOnboard('welcome'); return; }
  if(!hasBrain()){ if(state.overviewFailed){ showRetry(); return; } showOnboard('setup'); return; }
  render();
  startLiveRefresh();
  startEmbedPoll();
  maybeCheckUpdate(true);   // check once per launch so the update banner surfaces promptly
  maybeTour(900);
}
boot();
</script>
</body>
